name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write environment files
        # environment.ts must exist too (even though the production build's
        # fileReplacements swaps it for environment.prod.ts at bundle time)
        # because TypeScript resolves the import against it directly.
        run: |
          for f in src/environments/environment.ts src/environments/environment.prod.ts; do
            echo "export const environment = {" > "$f"
            echo "  production: true," >> "$f"
            echo "  supabaseUrl: '${{ secrets.SUPABASE_URL }}'," >> "$f"
            echo "  supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}'" >> "$f"
            echo "};" >> "$f"
          done

      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Add SPA fallback for client-side routing
        run: cp dist/medidata/browser/index.html dist/medidata/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/medidata/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

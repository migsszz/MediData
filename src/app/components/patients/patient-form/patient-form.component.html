<div class="page-header">
  <h1>{{ patientId() ? 'Edit patient' : 'Add patient' }}</h1>
</div>

@if (loading()) {
  <div class="loading">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else {
  <mat-card class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>First name</mat-label>
          <input matInput formControlName="first_name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last name</mat-label>
          <input matInput formControlName="last_name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date of birth</mat-label>
          <input matInput type="date" formControlName="date_of_birth" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Sex</mat-label>
          <mat-select formControlName="sex">
            @for (opt of sexOptions; track opt) {
              <mat-option [value]="opt">{{ opt }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Blood type</mat-label>
          <input matInput formControlName="blood_type" placeholder="e.g. O+" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
          <mat-label>Allergies</mat-label>
          <textarea matInput formControlName="allergies" rows="2"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" rows="3"></textarea>
        </mat-form-field>
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <div class="actions">
        <a mat-button routerLink="/patients">Cancel</a>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Saving...' : 'Save patient' }}
        </button>
      </div>
    </form>
  </mat-card>
}

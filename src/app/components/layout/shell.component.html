<mat-sidenav-container class="app-container">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    [class.collapsed]="!(isHandset$ | async) && collapsed()"
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <div class="sidenav-header">
      @if (!collapsed()) {
        <div class="brand">MediData</div>
      }
      @if (!(isHandset$ | async)) {
        <button
          mat-icon-button
          class="collapse-toggle"
          (click)="toggleCollapsed()"
          [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
          [matTooltip]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
          matTooltipPosition="right"
        >
          <mat-icon>{{ collapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        </button>
      }
    </div>
    @if (!collapsed()) {
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/patients" routerLinkActive="active-link">
          <mat-icon matListItemIcon>groups</mat-icon>
          <span matListItemTitle>Patients</span>
        </a>
      </mat-nav-list>
    } @else {
      <!-- Collapsed: plain icon buttons instead of mat-list-item. Icon
           buttons are built to center a single icon with symmetric padding,
           sidestepping mat-list-item's icon+text layout (asymmetric margins,
           an always-present content wrapper) entirely. -->
      <div class="collapsed-nav">
        <a
          mat-icon-button
          routerLink="/dashboard"
          routerLinkActive="active-icon"
          matTooltip="Dashboard"
          matTooltipPosition="right"
          aria-label="Dashboard"
        >
          <mat-icon>bar_chart</mat-icon>
        </a>
        <a
          mat-icon-button
          routerLink="/patients"
          routerLinkActive="active-icon"
          matTooltip="Patients"
          matTooltipPosition="right"
          aria-label="Patients"
        >
          <mat-icon>groups</mat-icon>
        </a>
      </div>
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      <button
        mat-icon-button
        (click)="theme.toggle()"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="signOut()" aria-label="Sign out" title="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    @if (isAnonymous()) {
      <div class="guest-banner">
        <mat-icon>info</mat-icon>
        <span>You're exploring a demo — your data here is private to this session.</span>
        <button mat-flat-button color="primary" (click)="openUpgradeDialog()">Upgrade to full account</button>
      </div>
    }

    <main class="content" [class.expanded]="!(isHandset$ | async) && collapsed()">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<h1 class="text-2xl font-bold mb-4">Dashboard</h1>

@if (loading()) {
  <div class="flex justify-center py-12">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
} @else {
  <div class="stats stats-vertical sm:stats-horizontal shadow w-full mb-6 bg-base-100">
    <div class="stat place-items-center">
      <div class="stat-value">{{ totalPatients() }}</div>
      <div class="stat-title">Total patients</div>
    </div>
    <div class="stat place-items-center">
      <div class="stat-value">{{ encountersThisMonth() }}</div>
      <div class="stat-title">Encounters this month</div>
    </div>
    <div class="stat place-items-center">
      <div class="stat-value">{{ averageAge() }}</div>
      <div class="stat-title">Average patient age</div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h2 class="card-title text-base">Encounters, last 6 months</h2>
        <div class="relative h-[280px]">
          <canvas baseChart [data]="encountersByMonthData()" type="bar" [options]="barOptions"></canvas>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h2 class="card-title text-base">Patients by sex</h2>
        <div class="relative h-[280px]">
          <canvas baseChart [data]="sexChartData()" type="pie" [options]="pieOptions"></canvas>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 shadow lg:col-span-2">
      <div class="card-body">
        <h2 class="card-title text-base">Top diagnoses</h2>
        <div class="relative h-[280px]">
          <canvas baseChart [data]="topDiagnosesData()" type="bar" [options]="horizontalBarOptions"></canvas>
        </div>
      </div>
    </div>
  </div>
}

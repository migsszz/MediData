<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="text-2xl font-bold text-center">MediData</h1>
      <p class="text-center text-sm text-base-content/60 mb-2">
        {{ mode() === 'signin' ? 'Sign in to your account' : 'Create an account' }}
      </p>

      @if (infoMessage()) {
        <div class="alert alert-info mb-3 text-sm py-2">
          <span class="material-icons text-lg">info</span>
          <span>{{ infoMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-1">
        <fieldset class="fieldset">
          <label class="label" for="login-email">Email</label>
          <input id="login-email" type="email" formControlName="email" autocomplete="email" class="input w-full" />
        </fieldset>

        <fieldset class="fieldset">
          <label class="label" for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="input w-full"
          />
        </fieldset>

        @if (errorMessage()) {
          <p class="text-error text-sm -mt-1">{{ errorMessage() }}</p>
        }

        <button type="submit" class="btn btn-primary w-full" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            {{ mode() === 'signin' ? 'Sign in' : 'Sign up' }}
          }
        </button>
      </form>

      <button type="button" class="btn btn-ghost btn-sm w-full mt-1" (click)="toggleMode()">
        {{ mode() === 'signin' ? "Need an account? Sign up" : 'Already have an account? Sign in' }}
      </button>

      <div class="divider text-xs text-base-content/50">or</div>

      <button type="button" class="btn btn-outline w-full" (click)="tryDemo()" [disabled]="demoLoading()">
        @if (demoLoading()) {
          <span class="loading loading-spinner loading-sm"></span>
        } @else {
          Try the demo
        }
      </button>
    </div>
  </div>
</div>

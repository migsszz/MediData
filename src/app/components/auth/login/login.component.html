<div class="login-page">
  <mat-card class="login-card">
    <h1>MediData</h1>
    <p class="subtitle">{{ mode() === 'signin' ? 'Sign in to your account' : 'Create an account' }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          {{ mode() === 'signin' ? 'Sign in' : 'Sign up' }}
        }
      </button>
    </form>

    <button mat-button type="button" class="full-width toggle" (click)="toggleMode()">
      {{ mode() === 'signin' ? "Need an account? Sign up" : 'Already have an account? Sign in' }}
    </button>

    <div class="divider"><span>or</span></div>

    <button
      mat-stroked-button
      type="button"
      class="full-width"
      (click)="tryDemo()"
      [disabled]="demoLoading()"
    >
      @if (demoLoading()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        Try the demo
      }
    </button>
  </mat-card>
</div>
